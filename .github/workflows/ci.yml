name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Type-check
        run: npm run typecheck

      - name: Check formatting
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Install test browser
        run: npm exec --no -- playwright install --with-deps chromium

      - name: Run Chromium extension tests
        run: npm run test:e2e

      - name: Package extension
        run: bash scripts/package.sh

      - name: Upload extension package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-status-extension
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload browser failure diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
