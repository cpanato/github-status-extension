name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Type-check
        run: npm run typecheck

      - name: Check formatting
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Test release validation and packaging
        run: npm run test:release

      - name: Test installer
        run: npm run test:installer

      - name: Build extension
        run: npm run build

      - name: Prepare release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bash scripts/prepare-release.sh "$RELEASE_TAG"

      - name: Install test browser
        run: npm exec --no -- playwright install --with-deps chromium

      - name: Run Chromium extension tests
        run: npm run test:e2e

      - name: Package extension
        run: bash scripts/package.sh

      - name: Upload verified release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-status-extension
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload browser failure diagnostics
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  sign:
    name: Sign release checksums
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-status-extension
          path: artifacts

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Verify and sign all release checksums
        working-directory: artifacts
        run: |
          shasum -a 256 -c SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          cosign verify-blob --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-status-extension-signed
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-status-extension-signed
          path: artifacts

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Verify signature and package checksums
        working-directory: artifacts
        run: |
          cosign verify-blob --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --bundle SHA256SUMS.sigstore.json SHA256SUMS
          shasum -a 256 -c SHA256SUMS

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]
          release_flags=(--latest=false)
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then
            release_flags+=(--prerelease)
          else
            release_flags=(--latest)
          fi
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Download the release assets below. Verify SHA256SUMS with cosign using the bundle and this tag's release.yml workflow identity, then verify the checksums before running install.sh. See the README for the bootstrap commands and prerequisites.

          This release is for manual installation. It is not published to the Chrome Web Store. GitHub is the only supported provider in this version.
          NOTES
          gh release create "$RELEASE_TAG" --draft \
            --verify-tag --title "$RELEASE_TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --generate-notes "${release_flags[@]}"

      - name: Upload all release assets before publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" artifacts/*

      - name: Verify uploaded assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/release-verification"
          cd "$RUNNER_TEMP/release-verification"
          cosign verify-blob --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --bundle SHA256SUMS.sigstore.json SHA256SUMS
          shasum -a 256 -c SHA256SUMS

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          latest=true
          if [[ "$RELEASE_TAG" == *-rc.* ]]; then
            latest=false
          fi
          gh release edit "$RELEASE_TAG" --draft=false --latest="$latest"
